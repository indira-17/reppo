total_time_steps: 50_000_000
normalize_env: false
max_episode_steps: ${env.max_episode_steps}
eval_interval: 2
num_eval: 20

# BC pretraining checkpoint path
bc_checkpoint_path: /scratch/cluster/idutta/reppo/outputs/2026-04-04/23-07-29/PickCube-v1/saved_models/20260404_231127_seed3/bc_model_actor_best.pkl
# /scratch/cluster/idutta/reppo/outputs/2026-03-06/17-41-47/PushCube-v1/saved_models/20260306_174149/bc_model_actor_best.pkl, /scratch/cluster/idutta/reppo/outputs/2026-04-04/22-35-06/PushCube-v1/saved_models/20260404_223758_seed3/bc_model_actor_best.pkl
# /scratch/cluster/idutta/reppo/outputs/2026-03-06/18-03-46/PullCube-v1/saved_models/20260306_180347/bc_model_actor_best.pkl, /scratch/cluster/idutta/reppo/outputs/2026-04-04/22-40-53/PullCube-v1/saved_models/20260404_224334_seed3/bc_model_actor_best.pkl
# /scratch/cluster/idutta/reppo/outputs/2026-03-06/18-06-40/PickCube-v1/saved_models/20260306_180642/bc_model_actor_best.pkl, /scratch/cluster/idutta/reppo/outputs/2026-04-04/23-07-29/PickCube-v1/saved_models/20260404_231127_seed3/bc_model_actor_best.pkl
# /scratch/cluster/idutta/reppo/outputs/2026-03-06/19-01-22/RollBall-v1/saved_models/20260306_190123/bc_model_actor_best.pkl, /scratch/cluster/idutta/reppo/outputs/2026-04-12/17-25-40/RollBall-v1/saved_models/20260412_172540_seed0/bc_model_actor_best.pkl, /scratch/cluster/idutta/reppo/outputs/2026-05-09/10-11-40/RollBall-v1/saved_models/20260509_101140_seed0/bc_model_actor_best.pkl
# /scratch/cluster/idutta/reppo/outputs/2026-04-07/23-07-03/AnymalC-Reach-v1/saved_models/20260407_230704_seed0/bc_model_actor_best.pkl
# /scratch/cluster/idutta/reppo/outputs/2026-03-06/19-06-23/AnymalC-Reach-v1/saved_models/20260306_190625/bc_model_actor_best.pkl, /scratch/cluster/idutta/reppo/outputs/2026-04-07/19-41-10/StackCube-v1/saved_models/20260407_194110_seed0/bc_model_actor_best.pkl, /scratch/cluster/idutta/reppo/outputs/2026-04-10/16-00-52/AnymalC-Reach-v1/saved_models/20260410_160052_seed0/bc_model_actor_best.pkl
# /scratch/cluster/idutta/reppo/outputs/2026-04-11/23-57-16/AnymalC-Reach-v1/saved_models/20260411_235716_seed0/bc_model_actor_best.pkl
bc_actor_update_delay : 0
bc_indicator: False
data_type: "online"  # "expert" | "PER" | "random" | "online" | "with_bc"
max_buffer_size: 1_000_000  # standard SAC replay buffer size
per_alpha: 0.6  # PER priority exponent (0 = uniform, 1 = fully prioritized)
per_beta: 0.4   # PER IS weight exponent (0 = no correction, 1 = full correction)
use_retrace: False
bc_pretrain_seeds: [0] # [0, 1, 2, 3, 4]

# phased replay schedule
critic_offline_warmup_iters: 0

# BC pretraining entropy ablation controls
bc_use_entropy: True
bc_use_entropy_tuning: True
bc_entropy_coef: ${algorithm.ent_start}
bc_ent_target_mult: ${algorithm.ent_target_mult}

# optimization settings (seem very stable)
optimizer:
  _target_: optax.adam
  learning_rate: 3e-4
anneal_lr: false
max_grad_norm: 0.5
polyak: 1.0 # maybe ablate ?

# problem discount settings (need tuning)
gamma: 0.99
lmbda: 0.95
lmbda_min: 0.95 # irrelevant if no exploration noise is added

# batch settings (need tuning for MJX humanoid)
num_steps: 128
num_mini_batches: 128
num_envs: 1024
num_epochs: 4

# exploration settings (currently not touched)
exploration_noise_max: 1.0
exploration_noise_min: 1.0
exploration_base_envs: 0

# critic architecture settings (need to be increased for MJX humanoid)
critic_hidden_dim: 512
actor_hidden_dim: 512
vmin: ${env.vmin}
vmax: ${env.vmax}
num_bins: 151
hl_gauss: true
use_critic_norm: true
num_critic_encoder_layers: 2
num_critic_head_layers: 2
num_critic_pred_layers: 2
use_simplical_embedding: False
use_critic_skip: False

# actor architecture settings (seem stable)
use_actor_norm: true
num_actor_layers: 3
actor_min_std: 0.0
use_actor_skip: False

# actor & critic loss settings (seem remarkably stable)
## kl settings
kl_start: 0.01
kl_bound: 0.1 # switched to tighter bounds for MJX
reduce_kl: true
reverse_kl: false # previous default "false"
update_kl_lagrangian: true
actor_kl_clip_mode: "clipped" # "full", "clipped", "kl_relu_clipped", "kl_bound_clipped", "value"
## entropy settings
ent_start: 0.01
ent_target_mult: 0.5
update_entropy_lagrangian: true
## auxiliary loss settings
aux_loss_mult: 1.0
gradient_estimator: "pathwise_q" # "score_based_gae", "score_based_q", "pathwise_q"
scale_samples_with_action_d: False
fixed_actor_std: False
policy_method: default

mask_truncated: True

network:
  _target_: src.algorithms.reppo.networks.make_continuous_ff_networks
  _partial_: true
init:
  _target_: src.algorithms.reppo.ff_reppo.make_init_fn
  _partial_: true
learner:
  _target_: src.algorithms.reppo.ff_reppo.make_learner_fn
  _partial_: true
policy:
  _target_: src.algorithms.reppo.reppo_policy.make_policy_fn
  _partial_: true
